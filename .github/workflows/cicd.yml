name: Simple CI/CD

on:
  push:
    branches:
      - dev
      - production

jobs:

# ======================
# BUILD IMAGE (DEV)
# ======================
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: my-org
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (DEV)
        run: |
          docker build -t ghcr.io/my-org/my-app:dev-${{ github.run_id }} .
          docker push ghcr.io/my-org/my-app:dev-${{ github.run_id }}

# ======================
# DEPLOY DEV
# ======================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-dev
    runs-on: dev-runner

    steps:
      - name: Deploy to Dev Cluster
        run: |
          kubectl patch deployment my-app \
          -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"my-app\",\"image\":\"ghcr.io/my-org/my-app:dev-${{ github.run_id }}\"}]}}}}"


# ======================
# BUILD IMAGE (PROD)
# ======================
  build-prod:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: my-org
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (PROD)
        run: |
          docker build -t ghcr.io/my-org/my-app:prod-${{ github.run_id }} .
          docker push ghcr.io/my-org/my-app:prod-${{ github.run_id }}

# ======================
# DEPLOY PROD
# ======================
  deploy-prod:
    if: github.ref == 'refs/heads/production'
    needs: build-prod
    runs-on: prod-runner

    steps:
      - name: Deploy to Production Cluster
        run: |
          kubectl patch deployment my-app \
          -p "{\"spec\":{\"template\":{\"spec\":{\"containers\":[{\"name\":\"my-app\",\"image\":\"ghcr.io/my-org/my-app:prod-${{ github.run_id }}\"}]}}}}"
