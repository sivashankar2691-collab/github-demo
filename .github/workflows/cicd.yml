name: Simple CI/CD

on:
  push:
    branches:
      - dev
      - main

jobs:

# ========================
# BUILD DEV IMAGE
# ========================
  build-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: YOUR_GITHUB_USERNAME
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (DEV)
        run: |
          docker build -t ghcr.io/YOUR_GITHUB_USERNAME/my-app:dev-${{ github.run_id }} .
          docker push ghcr.io/YOUR_GITHUB_USERNAME/my-app:dev-${{ github.run_id }}

# ========================
# DEPLOY DEV
# ========================
  deploy-dev:
    if: github.ref == 'refs/heads/dev'
    needs: build-dev
    runs-on: self-hosted

    steps:
      - name: Deploy (DEV)
        run: |
          echo "Deploying DEV image..."
          docker pull ghcr.io/YOUR_GITHUB_USERNAME/my-app:dev-${{ github.run_id }}

# ========================
# BUILD MAIN IMAGE
# ========================
  build-main:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: YOUR_GITHUB_USERNAME
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Docker Image (MAIN)
        run: |
          docker build -t ghcr.io/YOUR_GITHUB_USERNAME/my-app:main-${{ github.run_id }} .
          docker push ghcr.io/YOUR_GITHUB_USERNAME/my-app:main-${{ github.run_id }}

# ========================
# DEPLOY MAIN
# ========================
  deploy-main:
    if: github.ref == 'refs/heads/main'
    needs: build-main
    runs-on: self-hosted

    steps:
      - name: Deploy (MAIN)
        run: |
          echo "Deploying MAIN image..."
          docker pull ghcr.io/YOUR_GITHUB_USERNAME/my-app:main-${{ github.run_id }}
